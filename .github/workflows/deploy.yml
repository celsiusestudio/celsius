name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Maintenance mode: set the repo variable MAINTENANCE=true to publish
      # only the static page in maintenance/ instead of the app
      - name: Build maintenance page
        if: vars.MAINTENANCE == 'true'
        run: |
          mkdir dist
          cp maintenance/index.html public/CNAME public/favicon.png dist/
          cp dist/index.html dist/404.html

      - uses: actions/setup-node@v4
        if: vars.MAINTENANCE != 'true'
        with:
          node-version: 22
          cache: npm
      - if: vars.MAINTENANCE != 'true'
        run: npm ci
      - if: vars.MAINTENANCE != 'true'
        run: npm run build
      # SPA fallback so BrowserRouter routes work on direct load/refresh
      - if: vars.MAINTENANCE != 'true'
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
